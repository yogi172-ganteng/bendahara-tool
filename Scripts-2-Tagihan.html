<script>
// ==== TAGIHAN & TUNGGAKAN (klien) ====
var dataTagihan = [];
var dataTunggakan = { baris: [], ringkas: { nominal: 0, jumlahTaruna: 0 } };
var tagihanPratinjau = null;

var CHIP_STATUS_TAGIHAN = {
  Belum: 'chip',
  Sebagian: 'chip chip-sebagian',
  Lunas: 'chip chip-lunas'
};

function nilaiEl_(id) {
  var el = document.getElementById(id);
  return el ? el.value : '';
}

function filterTagihanAktif_() {
  return {
    q: nilaiEl_('tagihanCari'),
    jenis: nilaiEl_('tagihanFilterJenis'),
    periode: nilaiEl_('tagihanFilterPeriode').trim(),
    status: nilaiEl_('tagihanFilterStatus')
  };
}

function isiOpsiJenisBiayaTagihan_() {
  ['tagihanFilterJenis', 'genJenisBiaya', 'manualJenisBiaya'].forEach(function (id) {
    var el = document.getElementById(id);
    if (!el) return;
    var lama = el.value;
    var semuaOpsi = id === 'tagihanFilterJenis';
    var html = semuaOpsi ? '<option value="">Semua</option>' : '';
    (dataJenisBiaya || []).forEach(function (j) {
      if (!semuaOpsi && !j.aktif) return;
      html += '<option value="' + escapeHtml(j.kode) + '">' +
        escapeHtml(j.kode + ' (' + j.nama + ')') + '</option>';
    });
    el.innerHTML = html;
    if (Array.prototype.some.call(el.options, function (o) { return o.value === lama; })) {
      el.value = lama;
    }
  });
}

function isiOpsiPilihanTagihan_(id, labelSemua, ambil) {
  var el = document.getElementById(id);
  if (!el) return;
  var lama = el.value;
  var unik = {};
  (ambil() || []).forEach(function (v) { if (v) unik[v] = true; });
  var html = '<option value="">' + escapeHtml(labelSemua) + '</option>';
  Object.keys(unik).sort().reverse().forEach(function (v) {
    html += '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>';
  });
  el.innerHTML = html;
  if (Array.prototype.some.call(el.options, function (o) { return o.value === lama; })) {
    el.value = lama;
  }
}

function isiOpsiAngkatanTagihan_() {
  isiOpsiPilihanTagihan_('genAngkatan', 'Semua tahun masuk', function () {
    var semua = (dataTaruna || []).map(function (t) { return t.angkatan; });
    return semua.concat((dataTagihan || []).map(function (t) { return t.angkatan; }));
  });
  isiOpsiPilihanTagihan_('genRombel', 'Semua rombel', function () {
    return (dataTaruna || []).map(function (t) { return t.rombel; });
  });
}

function chipStatusTagihan_(status) {
  var kelas = CHIP_STATUS_TAGIHAN[status] || 'chip';
  return '<span class="' + kelas + '">' + escapeHtml(status || '-') + '</span>';
}

function aksiBarisTagihan_(t) {
  if (!sesiAktif || !sesiAktif.bisaTulis) return '';
  if (t.status === 'Lunas') return '<span class="dim">&mdash;</span>';
  return '<button class="btn btn-kecil" type="button" data-aksi="sesuaikan" data-id="' +
    escapeHtml(t.id) + '">Atur tagihan</button>';
}

function renderTagihan() {
  renderTabel(document.getElementById('tabelTagihan'), [
    { label: 'NISN', kunci: 'nisn', kelas: 'td-bukti num' },
    { label: 'Nama', kunci: 'nama', kelas: 'td-taruna' },
    { label: 'Kelas', kunci: 'kelas' },
    { label: 'Jenis Biaya', kunci: 'jenisBiaya' },
    { label: 'Periode', nilai: function (t) { return periodePanjang(t.periode); } },
    { label: 'Nominal Awal', nilai: function (t) { return rupiah(t.nominalAwal); }, kelas: 'td-jumlah num' },
    { label: 'Nominal Akhir', nilai: function (t) { return rupiah(t.nominalAkhir); }, kelas: 'td-jumlah num' },
    { label: 'Sisa', nilai: function (t) { return rupiah(t.sisa); }, kelas: 'td-jumlah num' },
    { label: 'Status', nilai: function (t) { return chipStatusTagihan_(t.status); }, html: true },
    { label: 'Aksi', nilai: aksiBarisTagihan_, html: true, kelas: 'td-aksi' }
  ], dataTagihan);
  isiTeks('tagihanJumlah', dataTagihan.length + ' tagihan');
}

function renderTunggakan() {
  var ringkas = (dataTunggakan && dataTunggakan.ringkas) || { nominal: 0, jumlahTaruna: 0 };
  isiTeks('tunggakanNominal', rupiah(ringkas.nominal || 0));
  isiTeks('tunggakanJumlah', (ringkas.jumlahTaruna || 0) + ' taruna menunggak');
}

/* ==== Surat tunggakan personal (Cetak A4) ==== */

function bukaSuratTunggakan() {
  var scrim = document.getElementById('scrimSuratTunggakan');
  if (!scrim) return;
  var pilih = document.getElementById('suratPilihTaruna');
  var baris = (dataTunggakan && dataTunggakan.baris) || [];
  if (pilih) {
    pilih.innerHTML = '';
    if (!baris.length) {
      pilih.appendChild(opsi_('Tidak ada taruna menunggak', ''));
    } else {
      pilih.appendChild(opsi_('- Pilih taruna -', ''));
      baris.forEach(function (t) {
        pilih.appendChild(opsi_(t.nama + ' (' + t.kelas + ') - ' + rupiah(t.tunggakan), t.nisn));
      });
    }
  }
  var tenggat = document.getElementById('suratTenggat');
  if (tenggat && !tenggat.value) {
    var d = new Date();
    d.setDate(d.getDate() + 14);
    tenggat.value = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
      '-' + String(d.getDate()).padStart(2, '0');
  }
  var isi = document.getElementById('isiSuratTunggakan');
  if (isi) isi.innerHTML = '';
  var cetak = document.getElementById('btnCetakSuratTunggakan');
  if (cetak) cetak.disabled = true;
  scrim.hidden = false;
}

function opsi_(teks, nilai) {
  var o = document.createElement('option');
  o.textContent = teks;
  o.value = nilai;
  return o;
}

function buatSuratTunggakan() {
  var pilih = document.getElementById('suratPilihTaruna');
  var nisn = pilih ? pilih.value : '';
  if (!nisn) {
    pemberitahuan('Pilih taruna yang menunggak terlebih dulu.', 'peringatan');
    return;
  }
  var tenggat = document.getElementById('suratTenggat');
  jalankan('getSuratTunggakan', [nisn, tenggat ? tenggat.value : ''], function (res) {
    if (!res || !res.success) {
      pemberitahuan((res && res.message) || 'Gagal membuat surat tunggakan.', 'galat');
      return;
    }
    var isi = document.getElementById('isiSuratTunggakan');
    if (isi) isi.innerHTML = renderSuratTunggakan(res.data || {});
    var cetak = document.getElementById('btnCetakSuratTunggakan');
    if (cetak) cetak.disabled = false;
  }, function (err) {
    pemberitahuan('Gagal membuat surat: ' + pesanGalat(err), 'galat');
  });
}

function renderSuratTunggakan(d) {
  var s = d.sekolah || {};
  var t = d.taruna || {};
  var barisan = d.baris || [];
  var tabelBaris = barisan.map(function (b) {
    return '<tr>' +
      '<td>' + escapeHtml(b.jenisBiaya) + '</td>' +
      '<td>' + escapeHtml(periodePanjang(b.periode)) + '</td>' +
      '<td class="num">' + rupiah(b.nominalAkhir) + '</td>' +
      '<td class="num">' + rupiah(b.terbayar) + '</td>' +
      '<td class="num">' + rupiah(b.sisa) + '</td>' +
      '</tr>';
  }).join('');
  var kontak = [s.telepon, s.email].filter(function (x) { return x; }).map(escapeHtml).join(' · ');
  return '' +
    '<div class="surat-cetak">' +
      '<div class="surat-kop">' +
        '<img class="surat-kop-logo surat-kop-logo-ntt" alt="Logo Provinsi Nusa Tenggara Timur" src="' + LOGO_NTT_KOP_ + '">' +
        '<div class="surat-kop-teks">' +
          '<div class="surat-kop-l1">PEMERINTAH PROVINSI NUSA TENGGARA TIMUR</div>' +
          '<div class="surat-kop-l2">DINAS PENDIDIKAN DAN KEBUDAYAAN</div>' +
          '<div class="surat-kop-l3">SEKOLAH MENENGAH KEJURUAN MARITIM NUSANTARA KUPANG</div>' +
          '<div class="surat-kop-l4">Jl. Pariwisata, Desa Mata Air, Kec. Kupang Tengah-Kab. Kupang</div>' +
          '<div class="surat-kop-l4">NPSN: 70050789; Telepon : 0812-4989-1546; Email: smkmaritimnusantarakpg@gmail.com</div>' +
        '</div>' +
        '<img class="surat-kop-logo surat-kop-logo-sek" alt="Logo Sekolah" src="' + LOGO_SEK_KOP_ + '">' +
      '</div>' +
      '<div class="surat-garis-kop"></div>' +
      '<div class="surat-judul">Surat Pemberitahuan Tunggakan Pembayaran</div>' +
      '<div class="surat-nomor">Nomor: ' + escapeHtml(d.nomorSurat || '') + '</div>' +
      '<p class="surat-yth">Yth. Orang Tua/Wali dari <b>' + escapeHtml(t.nama || '') + '</b>' +
        (t.kelas ? ' (' + escapeHtml(t.kelas) + ')' : '') +
        (t.emailOrtu ? '<br>Email: ' + escapeHtml(t.emailOrtu) : '') + '</p>' +
      '<p class="surat-paragraf">Dengan hormat, berdasarkan catatan keuangan sekolah per tanggal ' +
        tanggalPanjang(d.tanggalCetak) + ', tercatat tagihan berikut yang belum diselesaikan:</p>' +
      '<table class="surat-tabel">' +
        '<thead><tr><th>Jenis Biaya</th><th>Periode</th><th>Nominal</th><th>Terbayar</th><th>Sisa</th></tr></thead>' +
        '<tbody>' + tabelBaris + '</tbody>' +
      '</table>' +
      '<div class="surat-total">Total tunggakan: <span class="kuitansi-badge">' + rupiah(d.total) + '</span></div>' +
      '<p class="surat-paragraf">Mohon pembayaran dapat diselesaikan <b>paling lambat ' +
        tanggalPanjang(d.tenggat) + '</b> melalui bendahara sekolah' +
        (kontak ? ' (' + kontak + ')' : '') + '.</p>' +
      '<p class="surat-paragraf">Apabila pembayaran telah dilakukan sebelum surat ini diterima, mohon abaikan ' +
        'surat ini dan tunjukkan bukti pembayaran kepada bendahara. Atas perhatian dan kerja samanya kami ' +
        'sampaikan terima kasih.</p>' +
      '<div class="surat-ttd kuitansi-ttd-cetak">' +
        '<div>Kupang, ' + tanggalSuratPad_(d.tanggalCetak) + '</div>' +
        '<div>Bendahara Sekolah</div>' +
        '<div class="kuitansi-ttd-nama">' + escapeHtml(s.email || 'smkmaritimnusantarakpg@gmail.com') + '</div>' +
      '</div>' +
    '</div>';
}

/* Cetak A4 surat tunggakan lewat wadah khusus yang sama dengan kuitansi. */
function cetakSuratTunggakan() {
  var isi = document.getElementById('isiSuratTunggakan');
  var wadah = document.getElementById('cetakKuitansiWadah');
  if (!wadah || !isi || !isi.innerHTML) { return; }
  wadah.innerHTML = isi.innerHTML;
  document.body.classList.add('cetak-kuitansi');
  window.print();
  document.body.classList.remove('cetak-kuitansi');
  wadah.innerHTML = '';
}

function muatTagihan(tambah) {
  var lanjut = tambah === true;
  var f = filterTagihanAktif_();
  f.limit = BATAS_TABEL_;
  f.offset = lanjut ? offsetTagihan : 0;
  jalankan('getTagihan', [f], function (res) {
    if (!res || !res.success) {
      pemberitahuan('Gagal memuat tagihan: ' + ((res && res.message) || ''), 'galat');
      return;
    }
    var baris = res.data || [];
    dataTagihan = lanjut ? dataTagihan.concat(baris) : baris;
    offsetTagihan = dataTagihan.length;
    renderTagihan();
    isiOpsiAngkatanTagihan_();
    aturTombolMuatLagi_('btnTagihanLagi', baris.length === BATAS_TABEL_);
  }, function (err) {
    pemberitahuan('Gagal memuat tagihan: ' + pesanGalat(err), 'galat');
  });

  jalankan('getTunggakan', [], function (res) {
    if (!res || !res.success) return;
    dataTunggakan = res.data || { baris: [], ringkas: { nominal: 0, jumlahTaruna: 0 } };
    renderTunggakan();
  }, function () { pemberitahuan('Gagal memuat tunggakan.', 'galat'); });

  jalankan('getJenisBiaya', [], function (res) {
    if (!res || !res.success) return;
    dataJenisBiaya = res.data || [];
    isiOpsiJenisBiayaTagihan_();
  }, function () { /* opsi jenis biaya opsional */ });

  jalankan('getTaruna', [{}], function (res) {
    if (!res || !res.success) return;
    dataTaruna = res.data || [];
    isiOpsiAngkatanTagihan_();
  }, function () { /* opsi angkatan opsional */ });
}

function periodeDefaultTagihan_(kode) {
  var jenis = (dataJenisBiaya || []).filter(function (j) { return j.kode === kode; })[0];
  if (jenis && jenis.periode === 'Bulanan') {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  return '2026/2027';
}

function bukaGenerateTagihan() {
  var scrim = document.getElementById('scrimGenerateTagihan');
  if (!scrim) return;
  isiOpsiJenisBiayaTagihan_();
  var sel = document.getElementById('genJenisBiaya');
  if (sel && !sel.value && sel.options.length) sel.value = sel.options[0].value;
  aturNilaiKotak_('genPeriode', periodeDefaultTagihan_(sel ? sel.value : ''));
  aturNilaiKotak_('genAngkatan', '');
  aturNilaiKotak_('genRombel', '');
  tagihanPratinjau = null;
  var hasil = document.getElementById('hasilPratinjauTagihan');
  if (hasil) { hasil.hidden = true; hasil.innerHTML = ''; }
  var konfirm = document.getElementById('btnKonfirmGenerateTagihan');
  if (konfirm) konfirm.disabled = true;
  scrim.hidden = false;
}

function dataGenerateTagihan_() {
  return {
    jenisBiaya: nilaiEl_('genJenisBiaya'),
    periode: nilaiEl_('genPeriode').trim(),
    angkatan: nilaiEl_('genAngkatan'),
    rombel: nilaiEl_('genRombel')
  };
}

function pratinjauGenerateTagihanKlien_() {
  var hasil = document.getElementById('hasilPratinjauTagihan');
  var konfirm = document.getElementById('btnKonfirmGenerateTagihan');
  jalankan('pratinjauGenerateTagihan', [dataGenerateTagihan_()], function (res) {
    if (!res || !res.success) {
      pemberitahuan((res && res.message) || 'Pratinjau gagal.', 'galat');
      return;
    }
    var d = res.data || {};
    tagihanPratinjau = d;
    var html = 'Akan dibuat <strong>' + Number(d.jumlah || 0) + ' tagihan</strong> · total <strong>' +
      rupiah(d.total || 0) + '</strong>';
    if (d.dilewati && d.dilewati.length) {
      var potong = d.dilewati.slice(0, 5).map(function (x) {
        return escapeHtml(x.nama + ' (' + x.alasan + ')');
      }).join(', ');
      html += '<br>Dilewati ' + d.dilewati.length + ': ' + potong +
        (d.dilewati.length > 5 ? ', &hellip;' : '');
    }
    if (hasil) { hasil.innerHTML = html; hasil.hidden = false; }
    if (konfirm) konfirm.disabled = !(Number(d.jumlah) > 0);
  }, function (err) {
    pemberitahuan('Pratinjau gagal: ' + pesanGalat(err), 'galat');
  });
}

function jalankanGenerateTagihanKlien_(e) {
  e.preventDefault();
  if (kirimMenunggu) return;
  if (!tagihanPratinjau || !(Number(tagihanPratinjau.jumlah) > 0)) {
    pemberitahuan('Pratinjau dulu sebelum generate.', 'galat');
    return;
  }
  kirimMenunggu = true;
  kunciTombol_('btnKonfirmGenerateTagihan');
  jalankan('jalankanGenerateTagihan', [dataGenerateTagihan_()], function (res) {
    kirimMenunggu = false;
    bukaTombol_('btnKonfirmGenerateTagihan');
    if (!res || !res.success) {
      pemberitahuan((res && res.message) || 'Generate gagal.', 'galat');
      return;
    }
    var d = res.data || {};
    pemberitahuan(d.dibuat + ' tagihan dibuat, ' + d.dilewati + ' dilewati.', 'sukses');
    tutupPanelSemua_();
    muatTagihan();
  }, function (err) {
    kirimMenunggu = false;
    bukaTombol_('btnKonfirmGenerateTagihan');
    pemberitahuan('Generate gagal: ' + pesanGalat(err), 'galat');
  });
}

function bukaTagihanManual() {
  var scrim = document.getElementById('scrimTagihanManual');
  if (!scrim) return;
  isiOpsiJenisBiayaTagihan_();
  aturNilaiKotak_('manualNisn', '');
  aturNilaiKotak_('manualPeriode', periodeDefaultTagihan_(nilaiEl_('manualJenisBiaya')));
  aturNilaiKotak_('manualNominal', '');
  aturNilaiKotak_('manualKeterangan', '');
  scrim.hidden = false;
  var nisn = document.getElementById('manualNisn');
  if (nisn) nisn.focus();
}

function simpanTagihanManualKlien_(e) {
  e.preventDefault();
  if (kirimMenunggu) return;
  var d = {
    nisn: nilaiKotak_('manualNisn'),
    jenisBiaya: nilaiEl_('manualJenisBiaya'),
    periode: nilaiKotak_('manualPeriode').trim(),
    nominal: angkaNominal_(nilaiKotak_('manualNominal')),
    keterangan: nilaiKotak_('manualKeterangan')
  };
  if (!d.nisn || !d.periode || !d.nominal) {
    pemberitahuan('NISN, periode, dan nominal wajib diisi.', 'galat');
    return;
  }
  kirimMenunggu = true;
  kunciTombol_('btnSimpanTagihanManual');
  jalankan('simpanTagihanManual', [d], function (res) {
    kirimMenunggu = false;
    bukaTombol_('btnSimpanTagihanManual');
    if (!res || !res.success) {
      pemberitahuan((res && res.message) || 'Gagal menyimpan tagihan manual.', 'galat');
      return;
    }
    pemberitahuan('Tagihan manual tersimpan.', 'sukses');
    tutupPanelSemua_();
    muatTagihan();
  }, function (err) {
    kirimMenunggu = false;
    bukaTombol_('btnSimpanTagihanManual');
    pemberitahuan('Gagal menyimpan tagihan manual: ' + pesanGalat(err), 'galat');
  });
}

function bukaSesuaikanTagihan(id) {
  var scrim = document.getElementById('scrimSesuaikanTagihan');
  if (!scrim) return;
  var t = null;
  (dataTagihan || []).forEach(function (x) { if (x.id === id) t = x; });
  if (!t) return;
  aturNilaiKotak_('sesuaikanId', t.id);
  aturNilaiKotak_('sesuaikanNominal', String(t.nominalAkhir));
  aturNilaiKotak_('sesuaikanAlasan', '');
  var terbayar = Math.max(0, Number(t.nominalAkhir) - Number(t.sisa));
  isiTeks('sesuaikanInfo', t.nama + ' · ' + t.jenisBiaya + ' ' + periodePanjang(t.periode) +
    ' · sudah terbayar ' + rupiah(terbayar) + '. Nominal baru tidak boleh di bawah ' + rupiah(terbayar) + '.');
  scrim.hidden = false;
  var el = document.getElementById('sesuaikanNominal');
  if (el) el.focus();
}

function simpanSesuaikanTagihan_(e) {
  e.preventDefault();
  if (kirimMenunggu) return;
  var d = {
    id: nilaiKotak_('sesuaikanId'),
    nominalAkhir: angkaNominal_(nilaiKotak_('sesuaikanNominal')),
    alasan: nilaiKotak_('sesuaikanAlasan').trim()
  };
  if (!d.alasan) {
    pemberitahuan('Alasan penyesuaian wajib diisi.', 'galat');
    return;
  }
  kirimMenunggu = true;
  kunciTombol_('btnSimpanSesuaikanTagihan');
  jalankan('sesuaikanTagihan', [d], function (res) {
    kirimMenunggu = false;
    bukaTombol_('btnSimpanSesuaikanTagihan');
    if (!res || !res.success) {
      pemberitahuan((res && res.message) || 'Gagal menyesuaikan tagihan.', 'galat');
      return;
    }
    pemberitahuan('Tagihan disesuaikan.', 'sukses');
    tutupPanelSemua_();
    muatTagihan();
  }, function (err) {
    kirimMenunggu = false;
    bukaTombol_('btnSimpanSesuaikanTagihan');
    pemberitahuan('Gagal menyesuaikan tagihan: ' + pesanGalat(err), 'galat');
  });
}

function klikAksiTagihan(e) {
  var t = e.target;
  while (t && t.getAttribute && !t.getAttribute('data-aksi')) t = t.parentNode;
  var aksi = t && t.getAttribute ? t.getAttribute('data-aksi') : null;
  var id = t && t.getAttribute ? t.getAttribute('data-id') : null;
  if (!aksi || !id) return;
  if (aksi === 'sesuaikan') bukaSesuaikanTagihan(id);
}

// ==== PENERIMAAN / PEMBAYARAN (klien) ====
var dataPembayaran = [];
var tagihanTerbuka = [];

var CHIP_STATUS_BAYAR = {
  'Terverifikasi': 'chip chip-lunas',
  'Menunggu verifikasi': 'chip chip-sebagian',
  'Dibatalkan': 'chip chip-keluar'
};

function filterPembayaranAktif_() {
  return {
    q: nilaiEl_('pembayaranCari'),
    status: nilaiEl_('pembayaranFilterStatus'),
    metode: nilaiEl_('pembayaranFilterMetode')
  };
}

function chipStatusBayar_(status) {
  var kelas = CHIP_STATUS_BAYAR[status] || 'chip';
  return '<span class="' + kelas + '">' + escapeHtml(status || '-') + '</span>';
}

function aksiBarisPembayaran_(p) {
  if (!sesiAktif || !sesiAktif.bisaTulis) return '';
  var html = '<button class="btn btn-kecil" type="button" data-aksi="kuitansi" data-id="' +
    escapeHtml(p.noBukti) + '">Kuitansi</button>';
  var catatan = '';
  if (p.status === 'Menunggu verifikasi') {
    var email = String(sesiAktif.email || '').toLowerCase();
    if (String(p.dicatatOleh || '').toLowerCase() !== email) {
      html += ' <button class="btn btn-kecil btn-primary" type="button" data-aksi="verifikasi" data-id="' +
        escapeHtml(p.noBukti) + '">Verifikasi</button>';
    } else {
      // Aturan pemisahan tugas harus terlihat, bukan tombol yang hilang diam-diam.
      catatan = '<span class="dim">Anda yang mencatat, minta admin memverifikasi.</span>';
    }
  }
  if (p.status !== 'Dibatalkan') {
    html += ' <button class="btn btn-kecil btn-hapus" type="button" data-aksi="batal" data-id="' +
      escapeHtml(p.noBukti) + '">Batal</button>';
  }
  return html + catatan;
}

function renderPembayaran() {
  renderTabel(document.getElementById('tabelPembayaran'), [
    { label: 'No. Bukti', kunci: 'noBukti', kelas: 'td-bukti num' },
    { label: 'Tanggal', nilai: function (p) { return p.tanggal ? tanggalPendek(p.tanggal) : '-'; }, kelas: 'td-tanggal' },
    { label: 'NISN', kunci: 'nisn', kelas: 'td-bukti num' },
    { label: 'Nama', kunci: 'nama', kelas: 'td-taruna' },
    { label: 'Jenis Biaya', kunci: 'jenisBiaya' },
    { label: 'Periode', nilai: function (p) { return periodePanjang(p.periode); } },
    { label: 'Jumlah', nilai: function (p) { return rupiah(p.jumlah); }, kelas: 'td-jumlah num' },
    { label: 'Metode', kunci: 'metode' },
    { label: 'Status', nilai: function (p) { return chipStatusBayar_(p.status); }, html: true },
    { label: 'Aksi', nilai: aksiBarisPembayaran_, html: true, kelas: 'td-aksi' }
  ], dataPembayaran);
  isiTeks('pembayaranJumlah', dataPembayaran.length + ' pembayaran');
}

function segarkanAntrean_() {
  jalankan('getSesi', [], function (res) {
    if (!res || !res.success || !res.data) return;
    sesiAktif = res.data;
    var antrean = res.data.antrean || {};
    aturBadge('badgeTerima', antrean.terima);
    aturBadge('badgeKeluar', antrean.keluar);
  }, function () { /* badge opsional */ });
}

function muatPenerimaan(tambah) {
  var lanjut = tambah === true;
  var f = filterPembayaranAktif_();
  f.limit = BATAS_TABEL_;
  f.offset = lanjut ? offsetPembayaran : 0;
  jalankan('getPembayaran', [f], function (res) {
    if (!res || !res.success) {
      pemberitahuan('Gagal memuat pembayaran: ' + ((res && res.message) || ''), 'galat');
      return;
    }
    var baris = res.data || [];
    dataPembayaran = lanjut ? dataPembayaran.concat(baris) : baris;
    offsetPembayaran = dataPembayaran.length;
    renderPembayaran();
    aturTombolMuatLagi_('btnPenerimaanLagi', baris.length === BATAS_TABEL_);
  }, function (err) {
    pemberitahuan('Gagal memuat pembayaran: ' + pesanGalat(err), 'galat');
  });
  segarkanAntrean_();
}

function hariIniIso_() {
  var d = new Date();
  var bulan = String(d.getMonth() + 1).padStart(2, '0');
  var tanggal = String(d.getDate()).padStart(2, '0');
  return d.getFullYear() + '-' + bulan + '-' + tanggal;
}

function bukaCatatPembayaran() {
  var scrim = document.getElementById('scrimCatatPembayaran');
  if (!scrim) return;
  aturNilaiKotak_('bayarTanggal', hariIniIso_());
  aturNilaiKotak_('bayarMetode', 'Tunai');
  aturNilaiKotak_('bayarKeterangan', '');
  tagihanTerbuka = [];
  renderTagihanTerbuka();
  scrim.hidden = false;
  // Opsi kelas & taruna diambil dari data terbaru.
  jalankan('getTaruna', [{}], function (res) {
    if (res && res.success) dataTaruna = res.data || [];
    isiOpsiKelasBayar_();
    isiOpsiTarunaBayar_();
  }, function () {
    isiOpsiKelasBayar_();
    isiOpsiTarunaBayar_();
  });
  var el = document.getElementById('bayarKelas');
  if (el) el.focus();
}

// Kelas dulu, lalu nama taruna (NISN diambil dari opsi).
function isiOpsiKelasBayar_() {
  var el = document.getElementById('bayarKelas');
  if (!el) return;
  var lama = el.value;
  var unik = {};
  (dataTaruna || []).forEach(function (t) { if (t.kelas) unik[t.kelas] = true; });
  var html = '<option value="">Pilih kelas</option>';
  Object.keys(unik).sort(function (a, b) { return String(a).localeCompare(String(b), 'id'); })
    .forEach(function (k) {
      html += '<option value="' + escapeHtml(k) + '">' + escapeHtml(k) + '</option>';
    });
  el.innerHTML = html;
  if (Array.prototype.some.call(el.options, function (o) { return o.value === lama; })) el.value = lama;
}

function isiOpsiTarunaBayar_() {
  var el = document.getElementById('bayarTaruna');
  if (!el) return;
  var kelas = nilaiEl_('bayarKelas');
  var lama = el.value;
  var html = '<option value="">Pilih taruna</option>';
  (dataTaruna || []).filter(function (t) {
    if (!kelas || t.kelas !== kelas) return false;
    return !t.status || String(t.status).toLowerCase() === 'aktif';
  }).sort(function (a, b) { return String(a.nama).localeCompare(String(b.nama), 'id'); })
    .forEach(function (t) {
      html += '<option value="' + escapeHtml(t.nisn) + '">' + escapeHtml(t.nama) + '</option>';
    });
  el.innerHTML = html;
  if (Array.prototype.some.call(el.options, function (o) { return o.value === lama; })) el.value = lama;
  isiTeks('bayarNisnInfo', '');
}

function nisnTerpilihBayar_() {
  return nilaiEl_('bayarTaruna');
}

function muatTagihanTerbukaKlien_() {
  var nisn = nisnTerpilihBayar_();
  if (!/^\d{10}$/.test(nisn)) {
    pemberitahuan('Pilih kelas lalu nama taruna lebih dulu.', 'galat');
    return;
  }
  isiTeks('bayarNisnInfo', 'NISN ' + nisn);
  jalankan('getTagihanTerbuka', [nisn], function (res) {
    if (!res || !res.success) {
      pemberitahuan((res && res.message) || 'Gagal memuat tagihan.', 'galat');
      return;
    }
    tagihanTerbuka = res.data || [];
    renderTagihanTerbuka();
    if (!tagihanTerbuka.length) {
      pemberitahuan('Tidak ada tagihan terbuka untuk NISN ini.', 'info');
    }
  }, function (err) {
    pemberitahuan('Gagal memuat tagihan: ' + pesanGalat(err), 'galat');
  });
}

function renderTagihanTerbuka() {
  var kotak = document.getElementById('daftarTagihanTerbuka');
  if (!kotak) return;
  if (!tagihanTerbuka.length) {
    kotak.hidden = true;
    kotak.innerHTML = '';
    hitungTotalBayar_();
    return;
  }
  var html = '<table class="tagihan-pilih"><thead><tr>' +
    '<th>Pilih</th><th>Jenis</th><th>Periode</th><th>Sisa</th>' +
    '<th>Menunggu verifikasi</th><th>Jumlah bayar</th>' +
    '</tr></thead><tbody>';
  tagihanTerbuka.forEach(function (t) {
    var tersedia = t.tersedia === undefined ? Number(t.sisa) : Number(t.tersedia);
    html += '<tr>' +
      '<td><input type="checkbox" class="cek-bayar" data-id="' + escapeHtml(t.id) + '"></td>' +
      '<td>' + escapeHtml(t.jenisBiaya) + '</td>' +
      '<td>' + escapeHtml(periodePanjang(t.periode)) + '</td>' +
      '<td class="num">' + rupiah(t.sisa) + '</td>' +
      '<td class="num">' + rupiah(t.menungguVerifikasi || 0) + '</td>' +
      '<td><input class="input input-bayar" inputmode="numeric" data-id="' + escapeHtml(t.id) +
      '" value="' + tersedia + '" aria-label="Jumlah bayar ' + escapeHtml(t.jenisBiaya) + '"></td>' +
      '</tr>';
  });
  html += '</tbody></table>';
  kotak.innerHTML = html;
  kotak.hidden = false;
  kotak.querySelectorAll('.cek-bayar, .input-bayar').forEach(function (el) {
    el.addEventListener('input', hitungTotalBayar_);
    el.addEventListener('change', hitungTotalBayar_);
  });
  hitungTotalBayar_();
}

function rencanaBayar_() {
  var kotak = document.getElementById('daftarTagihanTerbuka');
  if (!kotak) return [];
  var hasil = [];
  kotak.querySelectorAll('.cek-bayar').forEach(function (cek) {
    if (!cek.checked) return;
    var id = cek.getAttribute('data-id');
    var input = kotak.querySelector('.input-bayar[data-id="' + id + '"]');
    hasil.push({ tagihanId: id, jumlah: angkaNominal_(input ? input.value : '0') });
  });
  return hasil;
}

function hitungTotalBayar_() {
  var rencana = rencanaBayar_();
  var total = rencana.reduce(function (a, b) { return a + (Number(b.jumlah) || 0); }, 0);
  isiTeks('bayarTotal', rupiah(total) + ' · ' + rencana.length + ' tagihan');
}

// B5: kunci dibuat sekali per niat simpan; dipakai ulang saat gagal, direset saat sukses.
var idemBayar = null;
function kunciIdemBaru_() {
  return 'IDEM-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
}

function simpanPembayaranKlien_(e) {
  e.preventDefault();
  if (kirimMenunggu) return;
  var rencana = rencanaBayar_();
  if (!rencana.length) {
    pemberitahuan('Centang minimal satu tagihan yang dibayar.', 'galat');
    return;
  }
  var d = {
    tanggal: nilaiKotak_('bayarTanggal'),
    metode: nilaiEl_('bayarMetode'),
    keterangan: nilaiKotak_('bayarKeterangan'),
    tagihan: rencana
  };
  if (!idemBayar) idemBayar = kunciIdemBaru_();
  d.idempotensiKey = idemBayar;
  if (!d.tanggal) {
    pemberitahuan('Tanggal pembayaran wajib diisi.', 'galat');
    return;
  }
  kirimMenunggu = true;
  kunciTombol_('btnSimpanPembayaran');
  jalankan('simpanPembayaran', [d], function (res) {
    kirimMenunggu = false;
    bukaTombol_('btnSimpanPembayaran');
    if (!res || !res.success) {
      pemberitahuan((res && res.message) || 'Gagal menyimpan pembayaran.', 'galat');
      return;
    }
    idemBayar = null;
    var bukti = (res.data && res.data.bukti) || [];
    pemberitahuan('Tersimpan: ' + bukti.join(', '), 'sukses');
    tutupPanelSemua_();
    muatPenerimaan();
    lupakanHalaman_(['tagihan', 'dashboard']);
  }, function (err) {
    kirimMenunggu = false;
    bukaTombol_('btnSimpanPembayaran');
    pemberitahuan('Gagal menyimpan pembayaran: ' + pesanGalat(err), 'galat');
  });
}

function verifikasiPembayaranKlien_(noBukti) {
  if (!window.confirm('Verifikasi pembayaran ' + noBukti + '?')) return;
  jalankan('verifikasiPembayaran', [{ noBukti: noBukti }], function (res) {
    if (!res || !res.success) {
      pemberitahuan((res && res.message) || 'Gagal verifikasi.', 'galat');
      return;
    }
    pemberitahuan(res.message || 'Pembayaran diverifikasi.', 'sukses');
    muatPenerimaan();
    lupakanHalaman_(['tagihan', 'dashboard']);
  }, function (err) {
    pemberitahuan('Gagal verifikasi: ' + pesanGalat(err), 'galat');
  });
}

function batalkanPembayaranKlien_(noBukti) {
  var alasan = window.prompt('Alasan pembatalan ' + noBukti + ':', '');
  if (alasan === null) return;
  if (!String(alasan).trim()) {
    pemberitahuan('Alasan pembatalan wajib diisi.', 'galat');
    return;
  }
  jalankan('batalkanPembayaran', [{ noBukti: noBukti, alasan: alasan }], function (res) {
    if (!res || !res.success) {
      pemberitahuan((res && res.message) || 'Gagal membatalkan.', 'galat');
      return;
    }
    pemberitahuan(res.message || 'Pembayaran dibatalkan.', 'sukses');
    muatPenerimaan();
    lupakanHalaman_(['tagihan', 'dashboard']);
  }, function (err) {
    pemberitahuan('Gagal membatalkan: ' + pesanGalat(err), 'galat');
  });
}

/* Angka -> kata (bahasa Indonesia), mis. 175000 -> 'Seratus tujuh puluh lima ribu'. */
function terbilang_(n) {
  n = Math.floor(Math.abs(Number(n) || 0));
  if (n === 0) return 'Nol';
  var satuan = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh',
    'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
  function sebut_(x) {
    if (x < 12) return satuan[x];
    if (x < 20) return sebut_(x - 10) + ' Belas';
    if (x < 100) return satuan[Math.floor(x / 10)] + ' Puluh ' + sebut_(x % 10);
    if (x < 200) return 'Seratus ' + sebut_(x - 100);
    if (x < 1000) return satuan[Math.floor(x / 100)] + ' Ratus ' + sebut_(x % 100);
    if (x < 2000) return 'Seribu ' + sebut_(x - 1000);
    if (x < 1000000) return sebut_(Math.floor(x / 1000)) + ' Ribu ' + sebut_(x % 1000);
    if (x < 1000000000) return sebut_(Math.floor(x / 1000000)) + ' Juta ' + sebut_(x % 1000000);
    if (x < 1000000000000) return sebut_(Math.floor(x / 1000000000)) + ' Miliar ' + sebut_(x % 1000000000);
    return sebut_(Math.floor(x / 1000000000000)) + ' Triliun ' + sebut_(x % 1000000000000);
  }
  var kata = sebut_(n).replace(/\s+/g, ' ').trim();
  return kata.charAt(0).toUpperCase() + kata.slice(1).toLowerCase();
}

function barisKuitansi_(label, nilai, sub) {
  return '<div class="kuitansi-baris"><dt>' + escapeHtml(label) + '</dt><dd>' +
    escapeHtml(nilai) + (sub ? '<span class="kuitansi-terbilang">' + escapeHtml(sub) + '</span>' : '') +
    '</dd></div>';
}

function renderKuitansi(d) {
  var sek = d.sekolah || {};
  var p = d.pembayaran || {};
  var t = d.taruna || {};
  var html = '<div class="kuitansi-cetak">'
    + '<div class="kuitansi-kop">'
    + '<img class="kuitansi-logo" src="' + LOGO_KUITANSI + '" alt="" width="44" height="44">'
    + '<div class="kuitansi-sekolah">' + escapeHtml(sek.nama || '') + '</div>'
    + '<div class="kuitansi-judul-cetak">Kuitansi</div>'
    + '</div>'
    + '<div class="kuitansi-garis-penuh"></div>'
    + '<dl class="kuitansi-isi-cetak">'
    + barisKuitansi_('Nomor', p.noBukti || '-')
    + barisKuitansi_('Sudah terima dari', String(t.nama || '-').toUpperCase() + (t.nisn ? ' · NISN ' + t.nisn : ''))
    + barisKuitansi_('Banyaknya uang', rupiah(p.jumlah || 0), terbilang_(p.jumlah || 0) + ' rupiah')
    + barisKuitansi_('Untuk pembayaran', (p.jenisBiaya || '-') + (p.periode ? ' periode ' + periodePanjang(p.periode) : ''))
    + '</dl>'
    + '<div class="kuitansi-detail">Kelas ' + escapeHtml(t.kelas || '-') + ' &middot; Metode '
    + escapeHtml(p.metode || '-') + ' &middot; Status ' + escapeHtml(p.status || '-') + '</div>'
    + '<div class="kuitansi-kaki">'
    + '<div class="kuitansi-badge">' + rupiah(p.jumlah || 0) + '</div>'
    + '<div class="kuitansi-ttd-cetak">'
    + '<div class="kuitansi-ttd-kota">Kupang, ' + escapeHtml(tanggalPanjang(p.tanggal || '')) + '</div>'
    + '<div class="kuitansi-ttd-label">Penerima,</div>'
    + '<div class="kuitansi-ttd-nama">' + escapeHtml(p.dicatatOleh || '-') + '</div>'
    + '</div>'
    + '</div>'
    + '</div>';
  return html;
}

function bukaKuitansi(noBukti) {
  var scrim = document.getElementById('scrimKuitansi');
  if (!scrim) return;
  jalankan('getKuitansi', [noBukti], function (res) {
    if (!res || !res.success) {
      pemberitahuan((res && res.message) || 'Gagal memuat kuitansi.', 'galat');
      return;
    }
    var isi = document.getElementById('isiKuitansi');
    if (isi) isi.innerHTML = renderKuitansi(res.data || {});
    scrim.hidden = false;
  }, function (err) {
    pemberitahuan('Gagal memuat kuitansi: ' + pesanGalat(err), 'galat');
  });
}

/* Cetak A4: salin isi kuitansi ke wadah khusus agar hasil cetak tepat satu
   halaman (shell aplikasi disembunyikan dengan display, bukan visibility). */
function cetakKuitansi() {
  var isi = document.getElementById('isiKuitansi');
  var wadah = document.getElementById('cetakKuitansiWadah');
  if (!wadah) { window.print(); return; }
  wadah.innerHTML = isi ? isi.innerHTML : '';
  document.body.classList.add('cetak-kuitansi');
  window.print();
  document.body.classList.remove('cetak-kuitansi');
  wadah.innerHTML = '';
}

function klikAksiPembayaran(e) {
  var t = e.target;
  while (t && t.getAttribute && !t.getAttribute('data-aksi')) t = t.parentNode;
  var aksi = t && t.getAttribute ? t.getAttribute('data-aksi') : null;
  var id = t && t.getAttribute ? t.getAttribute('data-id') : null;
  if (!aksi || !id) return;
  if (aksi === 'kuitansi') bukaKuitansi(id);
  else if (aksi === 'verifikasi') verifikasiPembayaranKlien_(id);
  else if (aksi === 'batal') batalkanPembayaranKlien_(id);
}
